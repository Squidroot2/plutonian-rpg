[package]
name = "plutonian-rpg"
version = "0.1.0"
edition = "2024"
default-run = "plutonian-rpg"
rust-version = "1.100.0"
license = "MIT"

[workspace]
members = [".", "crates/plutonian-save", "crates/plutonian-assets", "crates/plutonian-validate"]
default-members = [".", "crates/plutonian-save", "crates/plutonian-assets", "crates/plutonian-validate"]
resolver = "3"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
collapsible_if = "allow"
perf = { level = "deny", priority = -1 }
too_many_lines = "deny"
unwrap_used = "deny"
as_conversions = "deny"
disallowed_methods = "deny"

[lints]
workspace = true

[features]
default = []
smoke = []

[dependencies]
az = "1"
bevy = { version = "0.20", default-features = false, features = ["default_app", "std", "bevy_winit", "multi_threaded", "3d_bevy_render", "ui_bevy_render", "ui_picking", "default_font", "png", "bevy_audio", "vorbis", "x11", "wayland"] }
avian3d = "0.8"
bitcode = "0.6.9"
ron = "0.12"
schemars = { version = "1.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
strum = { version = "0.28", features = ["derive"] }
toml = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
debug = false
