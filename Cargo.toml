[package]
name = "plutonian-rpg"
version = "0.1.0"
edition = "2024"
default-run = "plutonian-rpg"
rust-version = "1.100.0"
license = "MIT"

[features]
default = []
smoke = []

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["default_app", "std", "bevy_winit", "multi_threaded", "3d_bevy_render", "ui_bevy_render", "ui_picking", "default_font", "png", "bevy_audio", "vorbis", "x11", "wayland"] }
avian3d = "0.8"
bitcode = "0.6.9"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
debug = false