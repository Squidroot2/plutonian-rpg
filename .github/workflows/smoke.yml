name: Desktop smoke scenarios

on:
  schedule:
    - cron: '0 6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  WGPU_BACKEND: vulkan
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libx11-dev libwayland-dev libxkbcommon-dev libasound2-dev \
            xvfb xauth mesa-vulkan-drivers libvulkan1 vulkan-tools libxkbcommon-x11-0 \
            libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0
      - name: Probe software Vulkan adapter
        run: |
          vulkaninfo --summary 2>&1 | tee /tmp/vulkan-summary.txt
          if ! grep -qi llvmpipe /tmp/vulkan-summary.txt; then
            echo 'No llvmpipe Vulkan device found' >&2
            exit 1
          fi
      - name: Install Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Build smoke scenarios
        run: cargo build --locked --features smoke

      - name: Arena smoke
        id: arena
        continue-on-error: true
        timeout-minutes: 15
        run: xvfb-run -a -s '-screen 0 1280x800x24' cargo run --locked --features smoke -- --smoke-test --windowed
      - name: Upload arena screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-arena-screenshots
          path: /tmp/plutonian-*.png
          if-no-files-found: warn

      - name: World smoke
        id: world
        continue-on-error: true
        timeout-minutes: 30
        run: xvfb-run -a -s '-screen 0 1280x800x24' cargo run --locked --features smoke -- --smoke-world --windowed
      - name: Upload world screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-world-screenshots
          path: /tmp/plutonian-*.png
          if-no-files-found: warn

      - name: Nemi smoke
        id: nemi
        continue-on-error: true
        timeout-minutes: 15
        run: xvfb-run -a -s '-screen 0 1280x800x24' cargo run --locked --features smoke -- --smoke-nemi --windowed
      - name: Upload Nemi screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-nemi-screenshots
          path: /tmp/plutonian-*.png
          if-no-files-found: warn

      - name: Cave smoke
        id: cave
        continue-on-error: true
        timeout-minutes: 30
        run: xvfb-run -a -s '-screen 0 1280x800x24' cargo run --locked --features smoke -- --smoke-cave --windowed
      - name: Upload cave screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-cave-screenshots
          path: /tmp/plutonian-*.png
          if-no-files-found: warn

      # Crossing is excluded until #63 fixes its death-screen stall.

      - name: Report scenario results
        if: always()
        run: |
          {
            echo '### Desktop smoke results'
            echo '| Scenario | Result |'
            echo '| --- | --- |'
            echo '| Arena | ${{ steps.arena.outcome }} |'
            echo '| World | ${{ steps.world.outcome }} |'
            echo '| Nemi | ${{ steps.nemi.outcome }} |'
            echo '| Cave | ${{ steps.cave.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ '${{ steps.arena.outcome }}' == success && '${{ steps.world.outcome }}' == success && '${{ steps.nemi.outcome }}' == success && '${{ steps.cave.outcome }}' == success ]]
