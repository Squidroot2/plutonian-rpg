name: Rust CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libx11-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libasound2-dev

      - name: Install Rust 1.100.0
        id: rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.100.0
          echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Check assets
        run: cargo run --locked -p plutonian-assets

      - name: Build
        run: cargo build --locked

      - name: Round-trip golden save fixtures
        run: |
          cargo build --locked --bin plutonian-save
          python3 scripts/golden_saves.py --check --binary target/debug/plutonian-save

      - name: Check save schema freshness
        run: cargo run --locked --quiet --bin plutonian-save -- schema | diff - golden-saves/save.schema.json

      - name: Validate save fixtures against schema
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 scripts/check_save_schema.py --binary target/debug/plutonian-save

      - name: Test
        run: cargo test --locked

      # Desktop smoke tests are omitted because they cannot run headless.
      - name: Clippy
        run: cargo clippy --locked --all-targets
